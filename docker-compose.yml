# CeyGreen root compose — Full stack orchestration.
# Student 2 services are live; teammate service blocks are commented out
# and ready to uncomment once their code is added.
#
# Usage:
#   cp .env.example .env
#   docker compose up --build

name: ceygreen

services:
  # ═══════════════════════════════════════════════════════════════════════
  #  SHARED INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ceygreen_users
      POSTGRES_USER: ceygreen
      POSTGRES_PASSWORD: ceygreen
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceygreen -d ceygreen_users"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27020:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka in KRaft mode — no ZooKeeper container.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"   # in-network Docker clients (bootstrap: kafka:9092)
      - "9094:9094"   # host machine (Maven, local tools)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ceygreenKRaftCluster01
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 25s
      retries: 10
      start_period: 40s

  # ═══════════════════════════════════════════════════════════════════════
  #  STUDENT 2 — User Management (port 8081)
  #  Also the OAuth 2.0 token issuer: it owns the private signing key.
  #  Postgres only — a Mongo outage can no longer take down login.
  # ═══════════════════════════════════════════════════════════════════════

  user-service:
    build: ./backend/user-service
    image: ghcr.io/vikumkodikara/ceygreen-user-service:latest
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      POSTGRES_URL: jdbc:postgresql://postgres:5432/ceygreen_users
      POSTGRES_USER: ceygreen
      POSTGRES_PASSWORD: ceygreen
      SERVICE_API_KEY: ${SERVICE_API_KEY:-ceygreen-dev-api-key}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ═══════════════════════════════════════════════════════════════════════
  #  STUDENT 2 — Disease Detection (port 8087)
  #  Validates tokens with the public key alone — never calls user-service.
  # ═══════════════════════════════════════════════════════════════════════

  diagnosis-service:
    build: ./backend/diagnosis-service
    image: ghcr.io/vikumkodikara/ceygreen-diagnosis-service:latest
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      MONGODB_URI: mongodb://mongo:27017/ceygreen_diagnoses
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_API_KEY: ${SERVICE_API_KEY:-ceygreen-dev-api-key}
      DIAGNOSIS_IMAGE_DIR: /app/data/diagnosis-images
      DISEASE_CLASSIFIER_IMPL: ${DISEASE_CLASSIFIER_IMPL:-onnx}
    volumes:
      - diagnosis_images:/app/data/diagnosis-images
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ═══════════════════════════════════════════════════════════════════════
  #  STUDENT 2 — API Gateway (port 8080)
  # ═══════════════════════════════════════════════════════════════════════

  api-gateway:
    build: ./backend/api-gateway
    image: ghcr.io/vikumkodikara/ceygreen-api-gateway:latest
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:8081
      DIAGNOSIS_SERVICE_URL: http://diagnosis-service:8087
      # Placeholder teammate URLs — gateway starts without these services existing.
      IOT_SERVICE_URL: ${IOT_SERVICE_URL:-http://iot-service:8082}
      TREATMENT_SERVICE_URL: ${TREATMENT_SERVICE_URL:-http://treatment-service:8083}
      ECOMMERCE_SERVICE_URL: ${ECOMMERCE_SERVICE_URL:-http://ecommerce-service:8084}
      FORUM_SERVICE_URL: ${FORUM_SERVICE_URL:-http://forum-service:8085}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:8086}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8088}
      DOWNSTREAM_API_KEY: ${SERVICE_API_KEY:-ceygreen-dev-api-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://16.192.168.12:3000,http://16.192.168.12}
      RATE_LIMIT_REQUESTS_PER_MIN: ${RATE_LIMIT_REQUESTS_PER_MIN:-60}
    depends_on:
      redis:
        condition: service_healthy
      # Login is the critical boot path, so the gateway waits on the token issuer only.
      # Every other downstream is reached lazily per request.
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ═══════════════════════════════════════════════════════════════════════
  #  CLIENT — Web Application (port 3000)
  # ═══════════════════════════════════════════════════════════════════════

  client:
    build:
      context: ./frontend
      args:
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
    image: ghcr.io/vikumkodikara/ceygreen-client:latest
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════
  #  STUDENT 1 — IoT Telemetry & Control Service (port 8082)
  # ═══════════════════════════════════════════════════════════════════════

  iot-service:
    build: ./backend/iot-service
    image: ghcr.io/vikumkodikara/ceygreen-iot-service:latest
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_API_KEY: ${SERVICE_API_KEY:-ceygreen-dev-api-key}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ═══════════════════════════════════════════════════════════════════════
  #  STUDENT 3 — Treatment & Suggestion Service (port 8083)
  #  Uncomment once Student 3's code is added to treatment-service/
  # ═══════════════════════════════════════════════════════════════════════

  treatment-service:
     build: ./backend/treatment-service
     image: ghcr.io/vikumkodikara/ceygreen-treatment-service:latest
     ports:
       - "8083:8083"
     environment:
       SERVER_PORT: 8083
       POSTGRES_URL: jdbc:postgresql://postgres:5432/ceygreen_treatments
       POSTGRES_USER: ceygreen
       POSTGRES_PASSWORD: ceygreen
       KAFKA_BOOTSTRAP_SERVERS: kafka:9092
       SERVICE_API_KEY: ${SERVICE_API_KEY:-ceygreen-dev-api-key}
     depends_on:
       postgres:
         condition: service_healthy
       kafka:
         condition: service_healthy
     healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
       interval: 10s
       timeout: 10s
       retries: 15
       start_period: 90s

  # ═══════════════════════════════════════════════════════════════════════
  #  E-Commerce Marketplace Service (port 8084)
  # ═══════════════════════════════════════════════════════════════════════

  ecommerce-service:
    build: ./backend/ecommerce-service
    image: ghcr.io/vikumkodikara/ceygreen-ecommerce-service:latest
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      POSTGRES_URL: jdbc:postgresql://postgres:5432/ceygreen_ecommerce
      POSTGRES_USER: ceygreen
      POSTGRES_PASSWORD: ceygreen
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_API_KEY: ${SERVICE_API_KEY:-ceygreen-dev-api-key}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ═══════════════════════════════════════════════════════════════════════
  #  STUDENT 5 — Community Forum Service (port 8085)
  #  Uncomment once Student 5's code is added to forum-service/
  # ═══════════════════════════════════════════════════════════════════════

  forum-service:
    build: ./backend/forum-service
    image: ghcr.io/vikumkodikara/ceygreen-forum-service:latest
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      MONGODB_URI: mongodb://mongo:27017/ceygreen_forum
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_API_KEY: ${SERVICE_API_KEY:-ceygreen-dev-api-key}
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ═══════════════════════════════════════════════════════════════════════
  #  STUDENT 5 — AI Assistant Service (port 8089)
  #  Separated from Forum Service to enforce strict microservice boundaries
  # ═══════════════════════════════════════════════════════════════════════

  ai-assistant-service:
    build: ./backend/ai-assistant-service
    image: ghcr.io/vikumkodikara/ceygreen-ai-assistant-service:latest
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      FORUM_SERVICE_URL: http://forum-service:8085
      SERVICE_API_KEY: ${SERVICE_API_KEY:-ceygreen-dev-api-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      forum-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ═══════════════════════════════════════════════════════════════════════
  #  STUDENT 6 — Sales Analytics (port 8086)
  #  Consumes order-events only, on its own consumer group.
  # ═══════════════════════════════════════════════════════════════════════

  analytics-service:
    build: ./backend/analytics-service
    image: ghcr.io/vikumkodikara/ceygreen-analytics-service:latest
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      POSTGRES_URL: jdbc:postgresql://postgres:5432/ceygreen_analytics
      POSTGRES_USER: ceygreen
      POSTGRES_PASSWORD: ceygreen
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_API_KEY: ${SERVICE_API_KEY:-ceygreen-dev-api-key}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ═══════════════════════════════════════════════════════════════════════
  #  STUDENT 6 — Notifications (port 8088)
  #  Consumes the five user-facing topics on its own consumer group, and
  #  owns its own database so analytics reporting cannot lock it out.
  # ═══════════════════════════════════════════════════════════════════════

  notification-service:
    build: ./backend/notification-service
    image: ghcr.io/vikumkodikara/ceygreen-notification-service:latest
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      POSTGRES_URL: jdbc:postgresql://postgres:5432/ceygreen_notifications
      POSTGRES_USER: ceygreen
      POSTGRES_PASSWORD: ceygreen
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_API_KEY: ${SERVICE_API_KEY:-ceygreen-dev-api-key}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ═══════════════════════════════════════════════════════════════════════
  #  GRAFANA — Dashboards (port 3001)
  #  Uncomment once dashboard configs are added to grafana/provisioning/
  # ═══════════════════════════════════════════════════════════════════════

  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3001:3000"
  #   volumes:
  #     - ./grafana/provisioning:/etc/grafana/provisioning
  #     - grafana_data:/var/lib/grafana
  #   environment:
  #     GF_SECURITY_ADMIN_USER: admin
  #     GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  postgres_data:
  mongo_data:
  diagnosis_images:
  # grafana_data:
