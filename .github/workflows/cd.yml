# ═══════════════════════════════════════════════════════════════════════════════
#  CeyGreen CD Pipeline — Docker Publish & Deploy
#  Builds Docker images and pushes to GitHub Container Registry (GHCR)
#  on every push to main. Optionally deploys to AWS EC2.
# ═══════════════════════════════════════════════════════════════════════════════

name: CD — Publish & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  #  Build & Push Docker Images to GHCR
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: ./backend/api-gateway
            image_name: ghcr.io/vikumkodikara/ceygreen-api-gateway
          - service: user-diagnosis-service
            context: ./backend/user-diagnosis-service
            image_name: ghcr.io/vikumkodikara/ceygreen-user-diagnosis-service
          - service: forum-service
            context: ./backend/forum-service
            image_name: ghcr.io/vikumkodikara/ceygreen-forum-service
          - service: client
            context: ./frontend
            image_name: ghcr.io/vikumkodikara/ceygreen-client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image_name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  #  Deploy to AWS EC2 (runs when EC2_HOST secret is configured)
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && secrets.EC2_HOST != ''
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/CeyGreen 2>/dev/null || cd ~/ceygreen

            git pull origin main

            echo "${{ secrets.DEPLOY_ENV_FILE }}" > .env

            docker compose pull
            docker compose up -d --build --remove-orphans

            echo "Waiting for services to be healthy..."
            sleep 30
            curl -sf http://localhost:8080/actuator/health || echo "Gateway health check pending..."
            curl -sf http://localhost:8081/actuator/health || echo "Service health check pending..."

            echo "Deployment complete!"
