# ═══════════════════════════════════════════════════════════════════════════════
#  CeyGreen CD Pipeline — Docker Publish & Deploy
#  Builds Docker images and pushes to GitHub Container Registry (GHCR)
#  on every push to main. Optionally deploys to AWS EC2.
# ═══════════════════════════════════════════════════════════════════════════════

name: CD — Publish & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

# Only one deployment at a time
concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ceygreen

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  #  Build & Push Docker Images to GHCR
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: ./api-gateway
          - service: user-diagnosis-service
            context: ./user-diagnosis-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  #  Deploy to AWS EC2 (optional — requires secrets)
  #
  #  Required GitHub Secrets:
  #    EC2_HOST          — public IP or hostname of the EC2 instance
  #    EC2_USER          — SSH username (e.g. ubuntu, ec2-user)
  #    EC2_SSH_KEY       — private SSH key for the EC2 instance
  #    DEPLOY_ENV_FILE   — contents of the .env file for deployment
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/ceygreen

            # Pull latest code
            git pull origin main

            # Write deployment env
            echo "${{ secrets.DEPLOY_ENV_FILE }}" > .env

            # Pull latest images and restart
            docker compose pull
            docker compose up -d --build --remove-orphans

            # Health check
            echo "Waiting for services to be healthy..."
            sleep 30
            curl -sf http://localhost:8080/actuator/health || echo "Gateway health check pending..."
            curl -sf http://localhost:8081/actuator/health || echo "Service health check pending..."

            echo "Deployment complete!"
