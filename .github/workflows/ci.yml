# ═══════════════════════════════════════════════════════════════════════════════
#  CeyGreen CI Pipeline
#  Builds and tests all available microservices on every push and PR.
# ═══════════════════════════════════════════════════════════════════════════════

name: CI — Build & Test

on:
  push:
    branches: [main, feature/*, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  #  Detect which services have changed (skip unchanged services)
  # ─────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      user-diagnosis-service: ${{ steps.filter.outputs.user-diagnosis-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            user-diagnosis-service:
              - 'user-diagnosis-service/**'

  # ─────────────────────────────────────────────────────────────────────────
  #  API Gateway — Build & Test
  # ─────────────────────────────────────────────────────────────────────────
  api-gateway:
    name: API Gateway — Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api-gateway == 'true' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: api-gateway/pom.xml

      - name: Build with Maven
        run: ./mvnw -B -ntp clean compile

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Package JAR
        run: ./mvnw -B -ntp package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: api-gateway/target/api-gateway-*.jar
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  #  User Diagnosis Service — Build & Test
  # ─────────────────────────────────────────────────────────────────────────
  user-diagnosis-service:
    name: User Diagnosis Service — Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.user-diagnosis-service == 'true' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: user-diagnosis-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: user-diagnosis-service/pom.xml

      - name: Build with Maven
        run: ./mvnw -B -ntp clean compile

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Package JAR
        run: ./mvnw -B -ntp package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-diagnosis-service-jar
          path: user-diagnosis-service/target/user-diagnosis-service-*.jar
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  #  Docker — Build Images (validates Dockerfiles compile)
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [api-gateway, user-diagnosis-service]
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: ./api-gateway
            needs-job: api-gateway
          - service: user-diagnosis-service
            context: ./user-diagnosis-service
            needs-job: user-diagnosis-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ceygreen/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
