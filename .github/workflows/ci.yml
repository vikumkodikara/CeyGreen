# ═══════════════════════════════════════════════════════════════════════════════
#  CeyGreen CI Pipeline
#  Builds and tests all available microservices on every push and PR.
# ═══════════════════════════════════════════════════════════════════════════════

name: CI — Build & Test

on:
  push:
    branches: [main, feature/*, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTCONTAINERS_REUSE_ENABLE: "true"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  #  API Gateway — Build & Test
  # ─────────────────────────────────────────────────────────────────────────
  api-gateway:
    name: API Gateway — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/api-gateway/pom.xml

      - name: Enable Testcontainers Reuse & Fix Permissions
        run: |
          mkdir -p ~/.testcontainers
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties
          chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -B -ntp clean compile

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Package JAR
        run: ./mvnw -B -ntp package -DskipTests

  # ─────────────────────────────────────────────────────────────────────────
  #  User Service — Build & Test
  # ─────────────────────────────────────────────────────────────────────────
  user-service:
    name: User Service — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/user-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/user-service/pom.xml

      - name: Enable Testcontainers Reuse & Fix Permissions
        run: |
          mkdir -p ~/.testcontainers
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties
          chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -B -ntp clean compile

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Package JAR
        run: ./mvnw -B -ntp package -DskipTests

  # ─────────────────────────────────────────────────────────────────────────
  #  Diagnosis Service — Build & Test
  # ─────────────────────────────────────────────────────────────────────────
  diagnosis-service:
    name: Diagnosis Service — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/diagnosis-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/diagnosis-service/pom.xml

      - name: Enable Testcontainers Reuse & Fix Permissions
        run: |
          mkdir -p ~/.testcontainers
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties
          chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -B -ntp clean compile

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Package JAR
        run: ./mvnw -B -ntp package -DskipTests

  # ─────────────────────────────────────────────────────────────────────────
  #  Forum Service — Build & Test
  # ─────────────────────────────────────────────────────────────────────────
  forum-service:
    name: Forum Service — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/forum-service

    # The context-load test connects to MongoDB at startup (auto-index-creation),
    # so provide one as a service container reachable at localhost:27017. Kafka is
    # intentionally absent: KafkaAdmin is non-fatal, so context startup is unaffected.
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/forum-service/pom.xml

      - name: Enable Testcontainers Reuse & Fix Permissions
        run: |
          mkdir -p ~/.testcontainers
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties
          chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -B -ntp clean compile

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Package JAR
        run: ./mvnw -B -ntp package -DskipTests

  # ─────────────────────────────────────────────────────────────────────────
  #  Docker — Build Images (validates Dockerfiles compile)
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [api-gateway, user-service, diagnosis-service, forum-service]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: ./backend/api-gateway
          - service: user-service
            context: ./backend/user-service
          - service: diagnosis-service
            context: ./backend/diagnosis-service
          - service: forum-service
            context: ./backend/forum-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ceygreen/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
