# ═══════════════════════════════════════════════════════════════════════════════
#  CeyGreen Code Quality Pipeline
#  Static analysis, security scanning, and dependency checks.
# ═══════════════════════════════════════════════════════════════════════════════

name: Quality — Lint & Security

on:
  push:
    branches: [main, feature/*, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  #  Docker Compose Validation
  # ─────────────────────────────────────────────────────────────────────────
  compose-validation:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create local .env from template
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet

  # ─────────────────────────────────────────────────────────────────────────
  #  Dockerfile Lint (Hadolint)
  # ─────────────────────────────────────────────────────────────────────────
  dockerfile-lint:
    name: Dockerfile Lint — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: ./backend/api-gateway/Dockerfile
          - service: user-service
            dockerfile: ./backend/user-service/Dockerfile
          - service: diagnosis-service
            dockerfile: ./backend/diagnosis-service/Dockerfile
          - service: forum-service
            dockerfile: ./backend/forum-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

  # ─────────────────────────────────────────────────────────────────────────
  #  Dependency Vulnerability & Updates Check
  # ─────────────────────────────────────────────────────────────────────────
  dependency-check:
    name: Dependency Check — ${{ matrix.service }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            path: ./backend/api-gateway
          - service: user-service
            path: ./backend/user-service
          - service: diagnosis-service
            path: ./backend/diagnosis-service
          - service: forum-service
            path: ./backend/forum-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      - name: Check for dependency updates
        working-directory: ${{ matrix.path }}
        run: ./mvnw -B -ntp versions:display-dependency-updates || true
