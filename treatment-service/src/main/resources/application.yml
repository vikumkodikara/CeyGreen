server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: treatment-service

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ceygreen_treatments}
    username: ${POSTGRES_USER:ceygreen}
    password: ${POSTGRES_PASSWORD:ceygreen}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate.jdbc.time_zone: UTC
    defer-datasource-initialization: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

ceygreen:
  security:
    api-key: ${SERVICE_API_KEY:ceygreen-dev-api-key}
  kafka:
    treatment-events-topic: ${KAFKA_TREATMENT_EVENTS_TOPIC:treatment-events}
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.ceygreen.treatment: ${LOG_LEVEL:INFO}
