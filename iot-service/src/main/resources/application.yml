server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: iot-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

ceygreen:
  security:
    api-key: ${SERVICE_API_KEY:ceygreen-dev-api-key}
  kafka:
    alert-topic: ${KAFKA_ALERT_TOPIC:greenhouse-alerts}
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}
  firebase:
    # Keep false until you add a real Firebase project + service account JSON.
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    database-url: ${FIREBASE_DATABASE_URL:}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}

logging:
  level:
    com.ceygreen.iot: ${LOG_LEVEL:INFO}
