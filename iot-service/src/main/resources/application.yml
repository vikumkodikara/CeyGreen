server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: iot-service

  # ---- Kafka: producer only. Publishes greenhouse-alerts when readings cross thresholds. ----
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

ceygreen:
  security:
    api-key: ${SERVICE_API_KEY:ceygreen-dev-api-key}
  kafka:
    greenhouse-alerts-topic: ${KAFKA_GREENHOUSE_ALERTS_TOPIC:greenhouse-alerts}
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:your-project-id}
    database-url: ${FIREBASE_DATABASE_URL:https://your-project.firebaseio.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.ceygreen.iot: ${LOG_LEVEL:INFO}
