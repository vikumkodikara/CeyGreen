server:
  port: 8086

spring:
  application:
    name: sales-analytics-notification-service-test

  datasource:
    url: jdbc:h2:mem:ceygreen_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
      missing-topics-fatal: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ceygreen:
  security:
    api-key-header: X-API-KEY
    api-key-value: ceygreen-secret-api-key-2026
  kafka:
    topics:
      order-events: order-events
      greenhouse-alerts: greenhouse-alerts
      diagnosis-events: diagnosis-events
      treatment-events: treatment-events
      stock-events: stock-events
      forum-events: forum-events
