server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service

  # ---- PostgreSQL: the users table, owned exclusively by this service ----
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ceygreen_users}
    username: ${POSTGRES_USER:ceygreen}
    password: ${POSTGRES_PASSWORD:ceygreen}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate.jdbc.time_zone: UTC

ceygreen:
  security:
    # Defense in depth: required on every endpoint except register/login, independently of
    # the gateway's OAuth layer, so a call that bypasses the gateway is still rejected.
    api-key: ${SERVICE_API_KEY:ceygreen-dev-api-key}
  jwt:
    # This service mints RS256 access tokens with the private key; the gateway and every other
    # CeyGreen service validate them with the matching public key. The committed dev keypair is
    # for local use only -- override both locations in any real deployment.
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:classpath:keys/dev-private.pem}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/dev-public.pem}
    issuer: ${JWT_ISSUER:https://ceygreen.local/auth}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.ceygreen.user: ${LOG_LEVEL:INFO}
