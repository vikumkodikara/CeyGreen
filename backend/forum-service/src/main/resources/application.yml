server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: forum-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ceygreen_forum}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

ceygreen:
  security:
    api-key: ${SERVICE_API_KEY:ceygreen-dev-api-key}
  kafka:
    forum-events-topic: ${KAFKA_FORUM_EVENTS_TOPIC:forum-events}
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.ceygreen.forum: ${LOG_LEVEL:INFO}

forum:
  ai-fallback:
    enabled: true
    unanswered-threshold-hours: 24
    check-interval-minutes: 30
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-1.5-flash
