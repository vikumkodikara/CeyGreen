server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: diagnosis-service

  # ---- MongoDB: the diagnoses collection, owned exclusively by this service ----
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27020/ceygreen_diagnoses}
      auto-index-creation: true

  # ---- Kafka: producer only. This service publishes and moves on; it consumes nothing. ----
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:6MB}

ceygreen:
  security:
    # Defense in depth: required on every endpoint except the docs and health probes,
    # independently of the gateway's OAuth layer, so a call that bypasses the gateway is
    # still rejected.
    api-key: ${SERVICE_API_KEY:ceygreen-dev-api-key}
  jwt:
    # This service only VERIFIES RS256 access tokens -- user-service mints them with the
    # matching private key. Nothing here can sign, so only the public key is present. The
    # committed dev key is for local use only -- override the location in any real deployment.
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/dev-public.pem}
    issuer: ${JWT_ISSUER:https://ceygreen.local/auth}
  kafka:
    diagnosis-topic: ${KAFKA_DIAGNOSIS_TOPIC:diagnosis-events}
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}

disease:
  classifier:
    # Selects the DiseaseClassifier implementation. "onnx" uses the trained ResNet50V2 model;
    # "mock" uses a deterministic stand-in for demos without the .onnx file.
    impl: ${DISEASE_CLASSIFIER_IMPL:onnx}
    # Below this confidence the API returns "uncertain - consult an expert" rather than a
    # false-confident diagnosis.
    confidence-threshold: ${DISEASE_CONFIDENCE_THRESHOLD:0.6}
    model-path: ${DISEASE_MODEL_PATH:classpath:models/disease_model.onnx}
    labels-path: ${DISEASE_LABELS_PATH:classpath:models/labels.txt}
  upload:
    directory: ${DIAGNOSIS_IMAGE_DIR:./data/diagnosis-images}
    max-file-size-bytes: ${DIAGNOSIS_MAX_IMAGE_BYTES:5242880}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    # Identical re-uploads reuse the stored result instead of running inference again.
    cache-identical-uploads: ${DIAGNOSIS_CACHE_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.ceygreen.diagnosis: ${LOG_LEVEL:INFO}
