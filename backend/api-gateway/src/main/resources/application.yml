server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway

  # Redis backs the token-bucket rate limiter. It holds no application data, so the gateway
  # remains stateless.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  security:
    oauth2:
      resourceserver:
        jwt:
          # The public half of the keypair user-service signs tokens with. It is
          # configured directly rather than fetched from a JWKS endpoint, so the gateway
          # boots and validates tokens even when that service is down.
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/dev-public.pem}

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Fail fast when a teammate's service is not running, rather than hanging the client.
            connect-timeout: ${DOWNSTREAM_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${DOWNSTREAM_RESPONSE_TIMEOUT:20s}

          # CORS is owned by Spring Security (see GatewaySecurityConfig) so browser
          # preflights are answered before the JWT filter, from one allowlist:
          # ceygreen.cors.allowed-origins / CORS_ALLOWED_ORIGINS.

          # Applied to every route: strip the /api prefix, then rate-limit per client IP.
          default-filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${ceygreen.rate-limit.replenish-rate}
                redis-rate-limiter.burstCapacity: ${ceygreen.rate-limit.burst-capacity}
                redis-rate-limiter.requestedTokens: ${ceygreen.rate-limit.requested-tokens}

          # The routing table: public path -> owning microservice. Every base URL is an env var,
          # so this gateway builds and runs without any teammate's service existing.
          routes:
            # ---- Student 2 (this repo): User Management ----
            # Also the token issuer -- it owns the private half of the keypair above.
            - id: user-management
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**

            # ---- Student 2 (this repo): Disease Detection ----
            - id: disease-detection
              uri: ${DIAGNOSIS_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/diagnosis/**

            # ---- Student 1: IoT Telemetry & Control ----
            - id: iot-telemetry
              uri: ${IOT_SERVICE_URL:http://iot-service:8082}
              predicates:
                - Path=/api/iot/**

            # ---- Student 3: Treatment & Suggestion ----
            # Reached by the client directly. This service's own diagnosis flow never calls it.
            - id: treatment-suggestion
              uri: ${TREATMENT_SERVICE_URL:http://treatment-service:8083}
              predicates:
                - Path=/api/treatments/**

            # ---- Student 4: E-Commerce Marketplace ----
            - id: ecommerce-products
              uri: ${ECOMMERCE_SERVICE_URL:http://ecommerce-service:8084}
              predicates:
                - Path=/api/products/**
            - id: ecommerce-orders
              uri: ${ECOMMERCE_SERVICE_URL:http://ecommerce-service:8084}
              predicates:
                - Path=/api/orders/**
            - id: ecommerce-dashboard
              uri: ${ECOMMERCE_SERVICE_URL:http://ecommerce-service:8084}
              predicates:
                - Path=/api/dashboard/**

            # ---- Block direct access to internal endpoints ----
            - id: block-internal
              uri: no://op
              predicates:
                - Path=/api/*/internal/**
              filters:
                - SetStatus=403
                
            # ---- Student 5: Community Forum Service ----
            - id: community-forum
              uri: ${FORUM_SERVICE_URL:http://forum-service:8085}
              predicates:
                - Path=/api/forum/**

            # ---- Student 5: AI Assistant Service ----
            - id: ai-assistant
              uri: ${AI_ASSISTANT_SERVICE_URL:http://ai-assistant-service:8089}
              predicates:
                - Path=/api/ai/**

            # ---- Student 6: Sales Analytics ----
            - id: sales-analytics
              uri: ${ANALYTICS_SERVICE_URL:http://analytics-service:8086}
              predicates:
                - Path=/api/analytics/**

            # ---- Student 6: Notifications ----
            - id: notifications
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8088}
              predicates:
                - Path=/api/notify/**

ceygreen:
  rate-limit:
    # Token bucket expressed per minute: with requested-tokens=60, a replenish-rate of N
    # tokens/second allows N requests per minute, and burst-capacity must be 60 x N to let a
    # full minute's allowance be spent at once.
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MIN:60}
    replenish-rate: ${RATE_LIMIT_REQUESTS_PER_MIN:60}
    burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:3600}
    requested-tokens: 60
  auth:
    # Paths reachable without a bearer token. Everything else needs a valid access token.
    public-paths:
      - /api/users/register
      - /api/users/login
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
  cors:
    # Comma-separated browser origins permitted to call the gateway.
    # Quoted so YAML does not split the default value on commas.
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://16.192.168.12:3000,http://16.192.168.12}"
  downstream:
    # Forwarded as X-API-Key so each microservice's own API-key check passes for traffic
    # arriving through the gateway, and fails for traffic that bypasses it.
    api-key: ${DOWNSTREAM_API_KEY:ceygreen-dev-api-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.ceygreen.gateway: ${LOG_LEVEL:INFO}
