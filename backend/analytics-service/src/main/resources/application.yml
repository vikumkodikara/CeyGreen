server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: analytics-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ceygreen_analytics}
    username: ${POSTGRES_USER:ceygreen}
    password: ${POSTGRES_PASSWORD:ceygreen}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Distinct from notification-service's group -- sharing one group id would make the two
      # services compete for order-events partitions instead of each seeing every event.
      group-id: analytics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

ceygreen:
  security:
    api-key: ${SERVICE_API_KEY:ceygreen-dev-api-key}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.ceygreen.analytics: ${LOG_LEVEL:INFO}
