<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280">
  <rect width="900" height="1280" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#111">Figure 3.2 CeyGreen deployment architecture</text>

  <!-- Layer labels -->
  <text x="36" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">Users</text>
  <rect x="220" y="68" width="460" height="44" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="450" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111">Farmer / Buyer web browser</text>

  <line x1="450" y1="112" x2="450" y2="146" stroke="#111" stroke-width="1.5"/>
  <polygon points="450,152 445,140 455,140" fill="#111"/>
  <text x="470" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333">HTTPS</text>

  <text x="36" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">Cloud host</text>
  <rect x="180" y="164" width="540" height="58" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="450" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111">AWS EC2  ·  Ubuntu 24.04  ·  eu-north-1</text>
  <text x="450" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444">GitHub Actions builds images and deploys on push to main</text>

  <line x1="450" y1="222" x2="450" y2="256" stroke="#111" stroke-width="1.5"/>
  <polygon points="450,262 445,250 455,250" fill="#111"/>

  <!-- Docker box -->
  <text x="36" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">Containers</text>
  <rect x="48" y="276" width="804" height="900" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="64" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#111">Docker Compose network  (ceygreen)</text>

  <rect x="220" y="318" width="460" height="50" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="450" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111">Nginx  :3000</text>
  <text x="450" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444">SPA files + proxy /api to gateway</text>

  <line x1="450" y1="368" x2="450" y2="396" stroke="#111" stroke-width="1.5"/>
  <polygon points="450,402 445,390 455,390" fill="#111"/>

  <rect x="220" y="406" width="460" height="44" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="450" y="434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111">API Gateway  :8080</text>

  <line x1="450" y1="450" x2="450" y2="478" stroke="#111" stroke-width="1.5"/>
  <polygon points="450,484 445,472 455,472" fill="#111"/>

  <!-- services -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111">
    <rect x="200" y="492" width="500" height="40" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="450" y="518" text-anchor="middle">user-diagnosis-service  :8081</text>

    <rect x="200" y="548" width="500" height="40" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="450" y="574" text-anchor="middle">iot-service  :8082</text>

    <rect x="200" y="604" width="500" height="40" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="450" y="630" text-anchor="middle">treatment-service  :8083</text>

    <rect x="200" y="660" width="500" height="40" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="450" y="686" text-anchor="middle">ecommerce-service  :8084</text>

    <rect x="200" y="716" width="500" height="40" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="450" y="742" text-anchor="middle">forum-service  :8085</text>

    <rect x="200" y="772" width="500" height="40" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="450" y="798" text-anchor="middle">analytics-notification-service  :8086</text>
  </g>

  <line x1="450" y1="532" x2="450" y2="548" stroke="#111" stroke-width="1"/>
  <line x1="450" y1="588" x2="450" y2="604" stroke="#111" stroke-width="1"/>
  <line x1="450" y1="644" x2="450" y2="660" stroke="#111" stroke-width="1"/>
  <line x1="450" y1="700" x2="450" y2="716" stroke="#111" stroke-width="1"/>
  <line x1="450" y1="756" x2="450" y2="772" stroke="#111" stroke-width="1"/>

  <line x1="450" y1="812" x2="450" y2="848" stroke="#111" stroke-width="1.5"/>
  <polygon points="450,854 445,842 455,842" fill="#111"/>
  <text x="468" y="838" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333">shared infrastructure</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">
    <rect x="80" y="868" width="170" height="70" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="165" y="898" text-anchor="middle">PostgreSQL</text>
    <text x="165" y="918" text-anchor="middle">:5433</text>

    <rect x="270" y="868" width="170" height="70" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="355" y="898" text-anchor="middle">MongoDB</text>
    <text x="355" y="918" text-anchor="middle">:27020</text>

    <rect x="460" y="868" width="170" height="70" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="545" y="898" text-anchor="middle">Redis</text>
    <text x="545" y="918" text-anchor="middle">:6379</text>

    <rect x="650" y="868" width="170" height="70" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="735" y="898" text-anchor="middle">Kafka KRaft</text>
    <text x="735" y="918" text-anchor="middle">:9092</text>
  </g>

  <text x="450" y="972" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444">Gateway uses Redis. Services use Postgres / Mongo. Producers publish to Kafka. Analytics consumes Kafka.</text>

  <rect x="160" y="996" width="580" height="50" fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="450" y="1018" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111">Firebase Realtime DB  (optional, outside Docker)</text>
  <text x="450" y="1036" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444">used by iot-service when FIREBASE_ENABLED=true</text>

  <text x="450" y="1088" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">Local: docker compose up --build</text>
  <text x="450" y="1110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">Production: same containers on EC2</text>
  <text x="450" y="1132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">Live: http://16.192.168.12:3000</text>
</svg>
