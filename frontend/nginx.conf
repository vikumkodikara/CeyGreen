server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/iot/ {
        set $iot_key $http_x_api_key;
        if ($iot_key != "ceygreen-dev-api-key") {
            add_header Content-Type application/json always;
            return 401 '{"status":401,"error":"Unauthorized","message":"A valid X-API-Key header is required"}';
        }
        proxy_pass http://api-gateway:8080/api/iot/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    # Proxy API calls directly to Spring Cloud API Gateway container inside docker network
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
