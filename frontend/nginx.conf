server {
    listen 80;
    server_name localhost;
    port_in_redirect off;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Single Page Application routing (handles /analytics, /dashboard, etc.)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy Sales Analytics and Notification calls directly to Student 6 backend container
    location /api/analytics/ {
        set $analytics_upstream "http://sales-analytics-notification-service:8086/analytics/";
        proxy_pass $analytics_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/notify/ {
        set $notify_upstream "http://sales-analytics-notification-service:8086/notify/";
        proxy_pass $notify_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/iot/ {
        set $iot_key $http_x_api_key;
        if ($iot_key != "ceygreen-dev-api-key") {
            add_header Content-Type application/json always;
            return 401 '{"status":401,"error":"Unauthorized","message":"A valid X-API-Key header is required"}';
        }
        set $gw_iot "http://api-gateway:8080/api/iot/";
        proxy_pass $gw_iot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    # Proxy other API calls directly to Spring Cloud API Gateway container inside docker network
    location /api/ {
        set $gw_api "http://api-gateway:8080/api/";
        proxy_pass $gw_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}



