server {
    listen 80;
    server_name _;

    # Disable absolute redirects to prevent Nginx from redirecting to localhost / container port
    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;

    # Frontend Single Page Application (SPA) routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # IoT Service route with API Key validation
    location /api/iot/ {
        set $iot_key $http_x_api_key;
        if ($iot_key != "ceygreen-dev-api-key") {
            add_header Content-Type application/json always;
            return 401 '{"status":401,"error":"Unauthorized","message":"A valid X-API-Key header is required"}';
        }
        proxy_pass http://api-gateway:8080/api/iot/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    # Exact match for /api so requests without trailing slash do not redirect to localhost
    location = /api {
        proxy_pass http://api-gateway:8080/api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy all API calls directly to Spring Cloud API Gateway container inside docker network
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
