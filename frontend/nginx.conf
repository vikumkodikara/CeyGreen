server {
    listen 80;
    server_name _;

    # Disable absolute redirects to prevent Nginx from redirecting to localhost / container port
    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;

    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 25M;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Single Page Application routing (handles /analytics, /dashboard, etc.)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy Grafana Dashboard and Embedded Panels
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        set $gw_grafana "http://grafana:3000";
        proxy_pass $gw_grafana;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy Sales Analytics and Notification calls through API Gateway
    location /api/analytics/ {
        set $gw_analytics "http://api-gateway:8080";
        proxy_pass $gw_analytics;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key "ceygreen-dev-api-key";
    }

    location /api/notify/ {
        set $gw_notify "http://api-gateway:8080";
        proxy_pass $gw_notify;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key "ceygreen-dev-api-key";
    }

    location /api/iot/ {
        set $iot_key $http_x_api_key;
        if ($iot_key != "ceygreen-dev-api-key") {
            add_header Content-Type application/json always;
            return 401 '{"status":401,"error":"Unauthorized","message":"A valid X-API-Key header is required"}';
        }
        set $gw_iot "http://api-gateway:8080";
        proxy_pass $gw_iot;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    # Exact match for /api so requests without trailing slash do not redirect to localhost
    location = /api {
        set $gw_api_exact "http://api-gateway:8080";
        proxy_pass $gw_api_exact;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy other API calls directly to Spring Cloud API Gateway container inside docker network
    location /api/ {
        set $gw_api "http://api-gateway:8080";
        proxy_pass $gw_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
