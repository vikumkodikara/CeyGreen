server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-diagnosis-service

  # ---- PostgreSQL: the users table, owned exclusively by this service ----
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ceygreen_users}
    username: ${POSTGRES_USER:ceygreen}
    password: ${POSTGRES_PASSWORD:ceygreen}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate.jdbc.time_zone: UTC

  # ---- MongoDB: the diagnoses collection, owned exclusively by this service ----
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27020/ceygreen_diagnoses}
      auto-index-creation: true

  # ---- Kafka: producer only. This service publishes and moves on; it consumes nothing. ----
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:6MB}

ceygreen:
  security:
    # Defense in depth: required on every endpoint except register/login, independently of
    # the gateway's OAuth layer, so a call that bypasses the gateway is still rejected.
    api-key: ${SERVICE_API_KEY:ceygreen-dev-api-key}
  jwt:
    # This service mints RS256 access tokens with the private key; the gateway validates
    # them with the matching public key. The committed dev keypair is for local use only --
    # override both locations in any real deployment.
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:classpath:keys/dev-private.pem}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/dev-public.pem}
    issuer: ${JWT_ISSUER:https://ceygreen.local/auth}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
  kafka:
    diagnosis-topic: ${KAFKA_DIAGNOSIS_TOPIC:diagnosis-events}
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}

disease:
  classifier:
    # Selects the DiseaseClassifier implementation. Only "mock" is implemented today;
    # "onnx" is reserved for the trained model and is not wired up yet.
    impl: ${DISEASE_CLASSIFIER_IMPL:mock}
    # Below this confidence the API returns "uncertain - consult an expert" rather than a
    # false-confident diagnosis.
    confidence-threshold: ${DISEASE_CONFIDENCE_THRESHOLD:0.6}
    # Reserved: the trained .onnx file will be dropped into src/main/resources/models/ later. Nothing reads this yet.
    model-path: ${DISEASE_MODEL_PATH:classpath:models/disease_model.onnx}
  upload:
    directory: ${DIAGNOSIS_IMAGE_DIR:./data/diagnosis-images}
    max-file-size-bytes: ${DIAGNOSIS_MAX_IMAGE_BYTES:5242880}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    # Identical re-uploads reuse the stored result instead of running inference again.
    cache-identical-uploads: ${DIAGNOSIS_CACHE_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.ceygreen.userdiagnosis: ${LOG_LEVEL:INFO}
