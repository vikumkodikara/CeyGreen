server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ecommerce-service
  # Default port 5433 matches docker-compose host mapping (5433:5432).
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/ceygreen_ecommerce}
    username: ${POSTGRES_USER:ceygreen}
    password: ${POSTGRES_PASSWORD:ceygreen}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

ceygreen:
  security:
    api-key: ${SERVICE_API_KEY:ceygreen-dev-api-key}
  marketplace:
    stock:
      low-threshold: ${MARKETPLACE_LOW_STOCK_THRESHOLD:10}
      restock-min-increase: ${MARKETPLACE_RESTOCK_MIN_INCREASE:5}
  kafka:
    order-events-topic: ${KAFKA_ORDER_EVENTS_TOPIC:order-events}
    stock-events-topic: ${KAFKA_STOCK_EVENTS_TOPIC:stock-events}
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.ceygreen.ecommerce: ${LOG_LEVEL:INFO}
